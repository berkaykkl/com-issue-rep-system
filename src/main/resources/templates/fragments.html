<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Toplumsal Sorun Bildirim'">Toplumsal Sorun Bildirim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg app-navbar" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand app-brand" th:href="@{/dashboard}">
            <span class="brand-mark">SB</span>
            <span>Sorun Bildirim</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Menüyü aç">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav app-nav-links me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/problem}">Bildirimlerim</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/problem/add}">Yeni Bildirim</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/problems}">Admin Paneli</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/ranking}">Ranking</a>
                </li>
            </ul>
            <div class="user-strip" sec:authorize="isAuthenticated()">
                <span class="user-chip">
                    <span class="user-dot"></span>
                    <span sec:authentication="name">kullanici</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-light btn-sm" type="submit">Çıkış</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer class="app-footer mt-auto" th:fragment="footer">
    <div class="container">Toplumsal Sorun Bildirim Sistemi</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
