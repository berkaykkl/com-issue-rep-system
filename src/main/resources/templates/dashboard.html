<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments :: head('Panel')"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments :: navbar"></div>

<main class="container py-4 flex-grow-1">
    <div class="page-title">
        <div>
            <p class="text-muted mb-1">Hoş geldin, <strong th:text="${currentUser.username}">user</strong></p>
            <h1 class="h3 mb-0">Kontrol paneli</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/problem/add}">Yeni bildirim</a>
    </div>

    <div class="stats-grid my-4">
        <div class="stat-box">
            <span>Puan</span>
            <strong th:text="${currentUser.score}">0</strong>
        </div>
        <div class="stat-box">
            <span>Rol</span>
            <strong th:text="${currentUser.role}">USER</strong>
        </div>
        <div class="stat-box">
            <span>Bildirim</span>
            <strong th:text="${#lists.size(problems)}">0</strong>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Son bildirimlerim</h2>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/problem}">Tümünü gör</a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(problems)}">
        Henüz bildirim oluşturmadın.
    </div>

    <div class="problem-grid" th:if="${!#lists.isEmpty(problems)}">
        <article class="problem-card" th:each="problem, iter : ${problems}" th:if="${iter.index < 3}">
            <img th:if="${problem.hasImage()}" th:src="${problem.imageAsBase64}" alt="Bildirim görseli">
            <div class="problem-card-body">
                <span class="badge"
                      th:text="${problem.status.label}"
                      th:classappend="${problem.status.name() == 'APPROVED'} ? ' bg-success' : (${problem.status.name() == 'REJECTED'} ? ' bg-danger' : ' bg-warning text-dark')">
                    Beklemede
                </span>
                <h3 class="h6 mt-3 mb-1" th:text="${problem.title}">Başlık</h3>
                <p class="text-muted small mb-0" th:text="${problem.category}">Kategori</p>
            </div>
        </article>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
