<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Kayıt Ol')"></head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-brand mb-4">
            <span class="brand-mark brand-mark-lg">SB</span>
            <div>
                <p class="text-primary fw-semibold mb-1">Toplumsal Sorun Bildirim Sistemi</p>
                <h1 class="h3 mb-2">Kayıt ol</h1>
                <p class="text-muted mb-0">Yeni hesap oluştur ve bildirim göndermeye başla.</p>
            </div>
        </div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="vstack gap-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div>
                <label class="form-label" for="username">Kullanıcı adı</label>
                <input class="form-control" id="username" th:field="*{username}" autocomplete="username"
                       th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'" autofocus>
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>

            <div>
                <label class="form-label" for="password">Şifre</label>
                <input class="form-control" id="password" type="password" th:field="*{password}"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>

            <div>
                <label class="form-label" for="confirmPassword">Şifre tekrar</label>
                <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>

            <button class="btn btn-primary w-100" type="submit">Kayıt ol</button>
        </form>

        <div class="auth-switch">
            Zaten hesabın var mı?
            <a th:href="@{/login}">Giriş yap</a>
        </div>
    </section>
</main>
</body>
</html>
