<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Bildirimlerim')"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments :: navbar"></div>

<main class="container py-4 flex-grow-1">
    <div class="page-title">
        <div>
            <h1 class="h3 mb-0">Bildirimlerim</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/problem/add}">Yeni bildirim</a>
    </div>

    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/problem}" method="get" class="search-bar my-4">
        <input class="form-control" type="search" name="q" th:value="${q}"
               placeholder="Başlık veya kategori ara">
        <button class="btn btn-outline-primary" type="submit">Ara</button>
        <a class="btn btn-outline-secondary" th:href="@{/problem}" th:if="${q != null && !#strings.isEmpty(q)}">Temizle</a>
    </form>

    <div class="empty-state" th:if="${#lists.isEmpty(problems)}">
        Kayıt bulunamadı.
    </div>

    <div class="problem-grid" th:if="${!#lists.isEmpty(problems)}">
        <th:block th:each="problem : ${problems}">
            <article class="problem-card">
                <img th:if="${problem.hasImage()}" th:src="${problem.imageAsBase64}" alt="Bildirim görseli">
                <div class="problem-card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <span class="badge"
                              th:text="${problem.status.label}"
                              th:classappend="${problem.status.name() == 'APPROVED'} ? ' bg-success' : (${problem.status.name() == 'REJECTED'} ? ' bg-danger' : ' bg-warning text-dark')">
                            Beklemede
                        </span>
                        <span class="text-muted small" th:text="${problem.formattedCreatedAt}">01.01.2026</span>
                    </div>
                    <h2 class="h5 mt-3" th:text="${problem.title}">Başlık</h2>
                    <p class="text-muted small mb-2" th:text="${problem.category}">Kategori</p>
                    <p class="problem-description" th:text="${problem.description}">Açıklama</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-view btn-sm" type="button"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#problemModal-' + ${problem.id}">
                            Görüntüle
                        </button>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/problem/{id}/edit(id=${problem.id})}">Düzenle</a>
                        <form th:action="@{/problem/{id}/delete(id=${problem.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Sil</button>
                        </form>
                    </div>
                </div>
            </article>

            <div class="modal fade" th:id="'problemModal-' + ${problem.id}" tabindex="-1"
                 th:attr="aria-labelledby='problemModalLabel-' + ${problem.id}" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content problem-modal">
                        <div class="modal-header">
                            <div>
                                <span class="badge"
                                      th:text="${problem.status.label}"
                                      th:classappend="${problem.status.name() == 'APPROVED'} ? ' bg-success' : (${problem.status.name() == 'REJECTED'} ? ' bg-danger' : ' bg-warning text-dark')">
                                    Beklemede
                                </span>
                                <h2 class="modal-title h5 mt-2" th:id="'problemModalLabel-' + ${problem.id}"
                                    th:text="${problem.title}">Bildirim</h2>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                        </div>
                        <div class="modal-body">
                            <img class="problem-modal-image" th:if="${problem.hasImage()}"
                                 th:src="${problem.imageAsBase64}" alt="Bildirim görseli">
                            <div class="problem-modal-meta">
                                <span th:text="${problem.category}">Kategori</span>
                                <span th:text="${problem.formattedCreatedAt}">01.01.2026</span>
                            </div>
                            <p class="problem-modal-description" th:text="${problem.description}">Açıklama</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Kapat</button>
                            <a class="btn btn-primary btn-sm" th:href="@{/problem/{id}/edit(id=${problem.id})}">Düzenle</a>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
