<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(${mode == 'create'} ? 'Yeni Bildirim' : 'Bildirim Düzenle')"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments :: navbar"></div>

<main class="container py-4 flex-grow-1">
    <div class="page-title">
        <div>
            <p class="text-muted mb-1">Fotoğraf veritabanında BLOB olarak saklanır.</p>
            <h1 class="h3 mb-0" th:text="${mode == 'create'} ? 'Yeni bildirim' : 'Bildirim düzenle'">Yeni bildirim</h1>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/problem}">Geri</a>
    </div>

    <form class="form-panel mt-4"
          th:action="${mode == 'create'} ? @{/problem/add} : @{/problem/{id}/edit(id=${problem.id})}"
          th:object="${problemForm}"
          method="post"
          enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label" for="title">Başlık</label>
            <input class="form-control" id="title" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="category">Kategori</label>
            <input class="form-control" id="category" th:field="*{category}" list="categoryOptions"
                   th:classappend="${#fields.hasErrors('category')} ? ' is-invalid'">
            <datalist id="categoryOptions">
                <option value="Altyapı"></option>
                <option value="Çevre"></option>
                <option value="Ulaşım"></option>
                <option value="Güvenlik"></option>
                <option value="Temizlik"></option>
            </datalist>
            <div class="invalid-feedback" th:errors="*{category}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Açıklama</label>
            <textarea class="form-control" id="description" rows="6" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="image">Fotoğraf</label>
            <input class="form-control" id="image" type="file" th:field="*{image}" accept="image/*"
                   th:classappend="${#fields.hasErrors('image')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{image}"></div>
            <div class="form-text" th:if="${mode == 'edit'}">Yeni dosya seçmezsen mevcut fotoğraf korunur.</div>
        </div>

        <button class="btn btn-primary" type="submit" th:text="${mode == 'create'} ? 'Oluştur' : 'Güncelle'">
            Kaydet
        </button>
    </form>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
