<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Admin Paneli')"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments :: navbar"></div>

<main class="container py-4 flex-grow-1">
    <div class="page-title">
        <div>
            <p class="text-muted mb-1">Tüm kullanıcı bildirimleri</p>
            <h1 class="h3 mb-0">Admin paneli</h1>
        </div>
    </div>

    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/admin/problems}" method="get" class="search-bar my-4">
        <input class="form-control" type="search" name="q" th:value="${q}"
               placeholder="Başlık veya kategori ara">
        <button class="btn btn-outline-primary" type="submit">Ara</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/problems}"
           th:if="${q != null && !#strings.isEmpty(q)}">Temizle</a>
    </form>

    <div class="table-responsive panel-table">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Görsel</th>
                <th>Başlık</th>
                <th>Kategori</th>
                <th>Kullanıcı</th>
                <th>Durum</th>
                <th>Tarih</th>
                <th class="text-end">İşlem</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(problems)}">
                <td colspan="7" class="text-center text-muted py-4">Kayıt bulunamadı.</td>
            </tr>
            <tr th:each="problem : ${problems}">
                <td>
                    <img class="table-image" th:if="${problem.hasImage()}" th:src="${problem.imageAsBase64}"
                         alt="Bildirim görseli">
                    <span class="text-muted small" th:unless="${problem.hasImage()}">Yok</span>
                </td>
                <td>
                    <strong th:text="${problem.title}">Başlık</strong>
                    <div class="text-muted small table-description" th:text="${problem.description}">Açıklama</div>
                </td>
                <td th:text="${problem.category}">Kategori</td>
                <td th:text="${problem.owner.username}">user</td>
                <td>
                    <span class="badge"
                          th:text="${problem.status.label}"
                          th:classappend="${problem.status.name() == 'APPROVED'} ? ' bg-success' : (${problem.status.name() == 'REJECTED'} ? ' bg-danger' : ' bg-warning text-dark')">
                        Beklemede
                    </span>
                </td>
                <td th:text="${problem.formattedCreatedAt}">01.01.2026</td>
                <td>
                    <div class="d-flex gap-2 justify-content-end flex-wrap">
                        <form th:action="@{/admin/problems/status}" method="post" class="d-flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" th:value="${problem.id}">
                            <select class="form-select form-select-sm" name="status">
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status.label}"
                                        th:selected="${status == problem.status}">
                                    Durum
                                </option>
                            </select>
                            <button class="btn btn-primary btn-sm" type="submit">Kaydet</button>
                        </form>
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/problem/{id}/edit(id=${problem.id})}">Düzenle</a>
                        <form th:action="@{/problem/{id}/delete(id=${problem.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Sil</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
